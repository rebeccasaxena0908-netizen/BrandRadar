# Brands tracked by Brand Radar. Sync into MySQL with:  python manage_brands.py
#
# keywords  Search terms for keyword sources (Hacker News, Reddit). A keyword containing a capital
#           letter is matched case-sensitively as a whole word ("Notion" the product, not "the notion
#           that..."); an all-lowercase keyword matches any case.
# exclude   Phrases removed from the text before matching, using the same case rule, e.g.
#           "Obsidian Entertainment" so the game studio doesn't count as Obsidian.
#           Stored in brands.keywords with a leading "-".
# subreddits  The brand's own subreddits (Reddit source, only used with Reddit API credentials): their
#           posts and top-level comments count without naming the brand. Stored in brands.keywords as "r/Name".
# exclude_if  Context words that drop the whole mention when present (same case rule), e.g. "Fallout"
#           for Obsidian the game studio. Stored in brands.keywords with a leading "!".
# app_store_id / play_store_id   Verified live on 2026-10-12 (iTunes lookup API / google-play-scraper).
# features  feature name -> synonyms. A mention only gets a feature when the name or a synonym appears
#           as a whole word (case-insensitive; simple endings like -s/-ed/-ing also match); the zero-shot
#           model then confirms and picks between matches. Keep a shared core so brands can be compared
#           feature by feature on the radar. "mobile app" is deliberately not a feature: it is the channel
#           almost every store review comes through, so it matched everything.

core_features: &core_features
  sync: [synchronization, synchronise, synchronize, across devices, between devices, other devices]
  offline: [no internet, without internet, no connection, no wifi, no signal, airplane mode]
  pricing: [price, cost, costly, expensive, cheap, subscription, subscribe, paywall, premium, pay, paid,
            fees, refund, free plan, free version, free tier, per month, per year, money]
  performance: [slow, fast, speed, lag, lagging, laggy, sluggish, freeze, frozen, loading, load time,
                battery, memory, ram, responsive]
  AI: [artificial intelligence, chatgpt, gpt, llm, llms, copilot, claude, notion ai, ai features]
  search: [searching, can't find, cannot find, can not find, lookup, look up]
  templates: [template]
  collaboration: [collaborate, collaborating, share, sharing, team, teams, teammate, coworker, colleague,
                  real-time, realtime, multiplayer, co-edit]
  integrations: [integration, integrate, api, zapier, slack, google calendar, google drive, github,
                 webhook, import, export]

brands:
  - name: Notion
    group: Note apps
    profile: software
    is_own: true
    keywords: [Notion, notion.so]
    subreddits: [Notion]
    exclude: [Notion Ink, Notion Capital, Notion of]   # "Notion of …" at a sentence start is the word, not the app
    exclude_if: [Ionian, Colophon, Klaros]   # Notion the ancient Greek city (#Notion travel posts on Mastodon)
    app_store_id: "1232780281"      # Notion: Notes, Tasks, AI — Notion Labs, Incorporated
    play_store_id: notion.id        # Notion: AI Workspace — Notion Labs, Inc.
    features:
      <<: *core_features
      editor: [editing, formatting, markdown, typing, font, blocks, text editor]
      databases: [database, db, table, tables, relation, relations, rollup, formula, linked view]

  - name: Obsidian
    group: Note apps
    profile: software
    is_own: false
    keywords: [Obsidian, obsidian.md]
    subreddits: [ObsidianMD]
    exclude: [Obsidian Entertainment, Obsidian Systems, Obsidian Security, Obsidian's games, Obsidian game,
              Obsidian games, Obsidian's game, Obsidian studio, Obsidian Software]
    # the game studio: drop any mention that also names one of its games
    exclude_if: [Fallout, The Outer Worlds, Outer Worlds, Pillars of Eternity, Avowed, Pentiment, KOTOR,
                 Knights of the Old Republic, Neverwinter Nights, Bethesda]
    app_store_id: "1557175442"      # Obsidian - Connected Notes — Dynalist Inc.
    play_store_id: md.obsidian      # Obsidian — Dynalist Inc.
    features:
      <<: *core_features
      editor: [editing, formatting, markdown, typing, font, text editor]
      plugins: [plugin, community plugin, extension, addon, add-on, theme]

  - name: Evernote
    group: Note apps
    profile: software
    is_own: false
    keywords: [evernote]
    subreddits: [Evernote]
    exclude: []
    app_store_id: "281796108"       # Evernote: AI Notes & Notebook — Evernote Corporation
    play_store_id: com.evernote     # Evernote - Note Organizer — Evernote by Bending Spoons
    features:
      <<: *core_features
      editor: [editing, formatting, markdown, typing, font, text editor]
      web clipper: [clipper, web clip, clipping]

  - name: ClickUp
    group: Note apps
    profile: software
    is_own: false
    keywords: [clickup]
    subreddits: [clickup]
    exclude: []
    app_store_id: "1535098836"                  # ClickUp: Tasks, Chat, Docs, AI — Mango Technologies, Inc.
    play_store_id: co.mangotechnologies.clickup # ClickUp: Tasks, Chat, Docs, AI — ClickUp
    features:
      <<: *core_features
      task management: [task, todo, to-do, checklist, subtask, deadline, assignee, sprint]
      notifications: [notification, notify, reminder, alert]

  # ---------------------------------------------------------------- Skincare (profile beauty_skincare)
  # No App Store / Google Play apps: YouTube comments, news headlines (and Reddit/Mastodon when enabled).
  # youtube_queries are searched (1 call each from the 100/day search cap); only videos whose title
  # names the brand are kept, and their comments count without repeating the name.

  - name: Laneige
    group: Skincare
    profile: beauty_skincare
    is_own: true
    keywords: [laneige]
    youtube_queries: [Laneige review, Laneige lip sleeping mask]

  - name: SKIN1004
    group: Skincare
    profile: beauty_skincare
    is_own: false
    keywords: [skin1004, skin 1004]   # the Madagascar Centella line; "centella" alone is an ingredient
    youtube_queries: [SKIN1004 centella review]

  - name: Cosrx
    group: Skincare
    profile: beauty_skincare
    is_own: false
    keywords: [cosrx]
    youtube_queries: [Cosrx review, Cosrx snail mucin]

  - name: Innisfree
    group: Skincare
    profile: beauty_skincare
    is_own: false
    keywords: [innisfree]
    exclude: [Lake Isle of Innisfree, Isle of Innisfree, Innisfree Hotels, Innisfree Hotel]
    exclude_if: [Yeats, poem, poetry, Sligo]   # W. B. Yeats' poem and the island in County Sligo
    youtube_queries: [Innisfree review]

  # ---------------------------------------------------------------- Stationery (profile stationery)
  # Every name here is also something else, so each needs a stationery word nearby (require_context,
  # case-insensitive, simple plurals match). News about the listed companies is kept via
  # "Industries", "Hindustan Pencils" and "Kokuyo". Keywords are lowercase (any case): buyers write
  # "Doms", "DOMS" and "doms" alike, and the context words already keep out the other meanings.
  # Checked with `python manage_brands.py dry-run --group Stationery` on 2026-10-13.

  - name: DOMS
    group: Stationery
    profile: stationery
    is_own: true
    keywords: [doms]
    require_context: [pencil, stationery, eraser, sharpener, crayon, colour, color, sketch, sketchbook, art,
                      drawing, pen, marker, highlighter, compass, geometry box, scale, school, kit, oil pastel,
                      notebook, Industries]
    exclude_if: [soreness, sore, muscle, muscles, workout, gym, leg day, recovery, lifting, stretching]   # DOMS = muscle soreness
    youtube_queries: [DOMS pencil review, DOMS stationery]

  - name: Apsara
    group: Stationery
    profile: stationery
    is_own: false
    keywords: [apsara, aspara]   # "Aspara" is a common misspelling
    require_context: [pencil, eraser, sharpener, stationery, extra dark, platinum, drawing, sketch, sketchbook,
                      school, pen, gel pen, brush pen, crayon, colour, color, kit, art, Hindustan Pencils]
    exclude: [Apsara Ice Cream, Apsara Ice Creams, Apsara reactor, Apsara-U]
    exclude_if: [reactor, BARC, Angkor, Cambodia, ice cream, dance, dancer]   # ISRO/BARC reactor, the celestial dancer
    youtube_queries: [Apsara pencil review]

  - name: Nataraj
    group: Stationery
    profile: stationery
    is_own: false
    # Official spelling is "Nataraj" (Hindustan Pencils); buyers often write "Natraj". Lowercase keywords
    # match any case, and "nataraj" already covers "Nataraj 621" / "Nataraj pencil", so those variants
    # only go in youtube_queries (extra keywords would just add duplicate HN/news/Reddit searches).
    keywords: [nataraj, natraj]
    require_context: [pencil, eraser, sharpener, stationery, school, drawing, sketch, pen, HB, kit,
                      Hindustan Pencils, "621"]   # 621 HB is the flagship pencil
    exclude_if: [Shiva, temple, Nataraja, cinema, theatre, theater, dance]   # Shiva's dance, cinemas named Natraj
    youtube_queries: [Nataraj pencil review, Nataraj 621]

  - name: Camlin
    group: Stationery
    profile: stationery
    is_own: false
    keywords: [camlin, kokuyocamlin]   # also the @KokuyoCamlin handle
    require_context: [pencil, colour, color, watercolor, watercolour, paint, crayon, marker, ink, pen, stationery,
                      art, sketch, drawing, geometry box, kit, school, notebook, eraser, sharpener, sharpner,
                      highlighter, gift box, pack, Kokuyo]
    youtube_queries: [Camlin colours review, Camlin stationery]

