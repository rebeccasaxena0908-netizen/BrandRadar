      texture: the texture or consistency, such as sticky, greasy, heavy, thick or watery
      scent: the scent or fragrance
      results: whether the product works or shows visible results
      packaging: the packaging, such as the bottle, pump, tube, jar or lid
      price/value: the price or value for money
      authenticity: fake or counterfeit products
      availability: availability, stock or where to buy it
      product request: a wish for a new product, shade, size or formula
      praise: praise or a compliment
      general discussion: a general discussion, not a complaint or praise
    praise: praise
    discussion: general discussion
    complaints: [skin reaction, texture, scent, results, packaging, price/value, authenticity, availability]
    complaints_need_non_positive: true
    request: product request
    features:
      hydration: [moisturizing, moisturising, hydrating, hydration, dry skin, dryness, moisture]
      acne: [breakout, breakouts, pimple, pimples, acne-prone, blemish, blemishes]
      sensitivity: [sensitive skin, irritation, irritated, redness, itchy, itching, burning, stinging, rash]
      texture: [sticky, greasy, oily, lightweight, heavy, thick, watery, absorbs, absorbed, residue]
      scent: [smell, smells, fragrance, fragranced, scented, perfume, perfumy]
      sun protection: [spf, sunscreen, sun cream, sun protection, white cast, uv]
      price: [price, expensive, cheap, affordable, worth it, value for money, overpriced, pricey]
      packaging: [packaging, bottle, pump, tube, jar, lid, dropper, container]
      authenticity: [fake, counterfeit, original, authentic, genuine, duplicate]
      availability: [out of stock, sold out, availability, restock, discontinued]
