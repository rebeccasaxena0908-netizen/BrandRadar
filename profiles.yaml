# Industry profiles: what the NLP pipeline, topics and dashboard look for, per kind of product.
# A brand picks one in brands.yaml (`profile:`); brands in the same group share a profile.
#
# categories   label -> zero-shot hypothesis ("This text is about {hypothesis}."). Descriptive phrases
#              work much better than bare labels. Must include the praise and discussion labels.
# praise / discussion   which labels mean praise and neutral talk ("praise" is never used for a
#              negative mention: the next-best category is taken instead)
# complaints   labels that put a mention in the complaint set (topics, priority matrix, alerts)
# complaints_need_non_positive   true: an aspect label only counts as a complaint when the mention is
#              not positive ("smells lovely" is about scent but not a complaint). Negative mentions
#              always count. software keeps false so existing results stay identical.
# request      optional label for "people asking for something new" (executive summary)
# features     default aspects with keyword synonyms (the keyword gate in nlp/features.py); a brand's
#              own `features` in brands.yaml replace these
# sources      sources fetched by default for brands with this profile (a brand can override)
# version      bump when this profile's categories or hypotheses change, then
#              python -m nlp.pipeline --reanalyse --model-version outdated

profiles:
  software:
    version: 1
    categories:
      bug: a bug, crash or error
      feature request: a request for a new feature
      pricing: pricing, cost or subscription
      performance: speed or performance
      UX/design: the user interface or design
      support: customer support or service
      praise: praise or a compliment
      general discussion: a general discussion, not a complaint or praise
    praise: praise
    discussion: general discussion
    complaints: [bug, performance, pricing, UX/design, support, feature request]
    complaints_need_non_positive: false
    request: feature request
    features:
      sync: [synchronization, synchronise, synchronize, across devices, between devices, other devices]
      offline: [no internet, without internet, no connection, no wifi, no signal, airplane mode]
      pricing: [price, cost, costly, expensive, cheap, subscription, subscribe, paywall, premium, pay, paid,
                fees, refund, free plan, free version, free tier, per month, per year, money]
      performance: [slow, fast, speed, lag, lagging, laggy, sluggish, freeze, frozen, loading, load time,
                    battery, memory, ram, responsive]
      AI: [artificial intelligence, chatgpt, gpt, llm, llms, copilot, claude, ai features]
      search: [searching, can't find, cannot find, can not find, lookup, look up]
      templates: [template]
      collaboration: [collaborate, collaborating, share, sharing, team, teams, teammate, coworker, colleague,
                      real-time, realtime, multiplayer, co-edit]
      integrations: [integration, integrate, api, zapier, slack, google calendar, google drive, github,
                     webhook, import, export]
    sources: [hackernews, appstore, playstore, reddit, mastodon, devto]

  beauty_skincare:
